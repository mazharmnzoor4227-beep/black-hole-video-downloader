name: Build BLACK HOLE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APKs
        run: gradle :app:assembleDebug --stacktrace

      - name: Show APK sizes
        run: ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-HOLE-lightweight-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
