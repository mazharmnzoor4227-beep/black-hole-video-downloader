plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blackhole.downloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blackhole.downloader'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

// Deliberately no native/NDK dependencies. This keeps BLACK HOLE architecture-independent,
// very small, and compatible with Android 9 through modern 16 KB-page-size Android devices.
dependencies {
}
