plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blackhole.downloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blackhole.downloader'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    // Physical Android phones are overwhelmingly ARM. Building per-ABI APKs
    // keeps the install around a fraction of the previous universal 200 MB APK.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    // Keep the extractor, but do not bundle the very large FFmpeg package.
    // High-quality MP4 video + M4A audio are merged with Android's native MediaMuxer.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
}
